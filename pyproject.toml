[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scapy-network-toolkit"
version = "2.0.0"
authors = [
  { name="Ibrahim Elshishtawy" },
]
description = "Comprehensive Network Security & Packet Suite built with Scapy, Requests, Paramiko, and Tkinter GUI"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Topic :: System :: Networking",
    "Topic :: Security",
]
dependencies = [
    "scapy>=2.5.0",
    "requests>=2.31.0",
    "paramiko>=3.4.0",
]

[project.scripts]
scapy-toolkit = "main:main"
scapy-gui = "gui:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "services*", "cli*", "gui*", "modules*"]
